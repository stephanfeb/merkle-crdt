name: merkledag
description: "Merkle-CRDTs in Dart: a content-addressed Merkle-DAG with Merkle clocks, so replicas converge over an unreliable, transport-agnostic network."
version: 1.0.1
repository: https://github.com/stephanfeb/merkle-crdt
issue_tracker: https://github.com/stephanfeb/merkle-crdt/issues

environment:
  sdk: ^3.5.0

# Add regular dependencies here.
dependencies:
  crypto: ^3.0.3
  dcid: ^1.0.0
  collection: ^1.19.0
  logging: ^1.2.0
  synchronized: ^3.3.0+3 # Using this for Lock

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
  mockito: ^5.4.4
  build_runner: ^2.4.10
